name: Lakshya AI Continuous Integration & Release Gate

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  frontend-verification:
    name: Frontend Quality & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Validation (0 Errors)
        run: npx tsc --noEmit

      - name: Run Automated Frontend Tests (Vitest)
        run: npm run test

      - name: Production Bundle Build
        run: npm run build

  backend-verification:
    name: Backend Tests & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./lakshyaai-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Test Database Schema
        working-directory: ./lakshyaai-backend
        env:
          TESTING: "true"
          DATABASE_URL: "sqlite:///./lakshyaai.db"
        run: python -c "from app.db import models; from app.db.database import create_tables; create_tables()"

      - name: Run Backend Test Suite
        working-directory: ./lakshyaai-backend
        env:
          TESTING: "true"
          DATABASE_URL: "sqlite:///./lakshyaai.db"
        run: python -m unittest discover -s tests -p "test_*.py"
